<!DOCTYPE html>
<html lang="en">
	<head>

		<script src="./js/adminAddPromotion.js" type="module"></script>

		<link rel="stylesheet" href="./index.css" />
		<title>Add a promotion</title>

	<body>

		<main>
			<h2>Add a promotion</h2>

		</main>
