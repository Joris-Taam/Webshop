<!DOCTYPE html>
<html lang="nl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Mijn bestellingen</title>
		<link rel="stylesheet" href="index.css" />
		<link rel="stylesheet" href="./css/orders.css" />
		<script type="module" src="./js/shared/navbar.js" defer></script>
		<script type="module" src="./js/shared/footer.js" defer></script>
		<script type="module" src="./js/orders.js"></script>
	</head>
	<body data-api-base="http://localhost:4001/api/orders">
		<navbar-component></navbar-component>

		<main class="orders-shell">
			<img src="./img/logo.png" id="logo" alt="Logo" />
			<div class="orders-wrapper">
				<header class="orders-header">
					<div class="orders-branding">
						<h1 class="orders-title">Mijn bestellingen</h1>
						<p class="orders-subtitle">Check hier je bestellingen met status, datum en totaal.</p>
					</div>
					<div class="orders-actions">
						<button id="orders-refresh" class="orders-refresh" type="button">Ververs lijst</button>
					</div>
				</header>

				<p id="orders-error" class="error-message" role="alert" hidden></p>
				<div id="orders-grid" class="orders-grid" aria-live="polite">
					<p class="orders-loading">Bezig met laden...</p>
				</div>
			</div>
		</main>

		<footer-component></footer-component>
	</body>
</html>
