<!DOCTYPE html>
<html lang="nl">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Nieuw Product Toevoegen</title>
	<script type="module" src="./js/shared/sidebar.js" defer></script>
	<link rel="stylesheet" href="./css/AdminAddProduct.css" />
	<link rel="stylesheet" href="./index.css" />
</head>

<body>
	<sidebar-component></sidebar-component>
	<section class="admin-container">
		<h2 class="section-title">Product Gegevens</h2>
		<form id="productForm" class="product-form" enctype="multipart/form-data" novalidate>
			<section class="form-group">
				<label for="name">Product Naam *</label>
				<input type="text" id="name" name="name" required />
				<div class="error-message"></div>
			</section>
			<section class="form-group">
				<label for="description">Product Omschrijving *</label>
				<textarea id="description" name="description" rows="4"></textarea>
				<div class="error-message"></div>
			</section>
			<section class="form-group">
				<label for="price">Prijs (€) *</label>
				<input type="number" id="price" name="price" min="0.01" step="0.01" required />
				<div class="error-message"></div>
			</section>
			<section class="form-group">
				<label for="category">Categorie *</label>
				<select id="category" name="category" required>
					<option value="">Selecteer categorie</option>
				</select>
				<div class="error-message"></div>
			</section>

			<section class="form-group">
				<label for="sizeWidth">Breedte (cm) *</label>
				<input type="number" id="sizeWidth" name="sizeWidth" min="0" step="0.01" required />
				<div class="error-message"></div>
			</section>
			<section class="form-group">
				<label for="sizeHeight">Hoogte (cm) *</label>
				<input type="number" id="sizeHeight" name="sizeHeight" min="0" step="0.01" required />
				<div class="error-message"></div>
			</section>
			<section class="form-group">
				<label for="sizeLength">Lengte (cm) *</label>
				<input type="number" id="sizeLength" name="sizeLength" min="0" step="0.01" required />
				<div class="error-message"></div>
			</section>
			<section class="form-group">
				<label for="fileExtension">bestaand extentie</label>
				<input type="text" id="fileExtension" name="fileExtension" />
				<div class="error-message"></div>
			</section>
			<section class="form-group">
				<label for="file">Product Bestand *</label>
				<input type="file" id="file" name="file" required />
				<div class="error-message"></div>
			</section>

			<section class="form-group">
				<label for="img">Afbeelding *</label>
				<input type="file" id="img" name="img" />
				<div class="error-message"></div>
			</section>


			<button type="button" class="btn" id="submitBtn">Product toevoegen</button>
		</form>
	</section>
	<script type="module" src="./js/AdminAddProduct.js" defer></script>
</body>

</html>
