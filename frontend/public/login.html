<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="./css/login.css" />
		<link rel="stylesheet" href="./index.css" />
		<script type="module" src="login.js" defer></script>
	</head>
	<body>
		<main>
			<section class="container">
				<img class="logo" src="./img/logo.svg" />
				<input class="email" type="email" placeholder="Email" required />
				<input class="password" type="password" required placeholder="Wachtwoord" />
				<span class="forgotPassword"><a href="https://www.google.com">Wachtwoord vergeten</a></span>
				<section class="buttons">
					<input class="btn" type="button" value="Login" />
					<input class="btn secondarybtn" type="button" value="terug" />
				</section>
				<p>Nog geen account? <a class="register" href="signup.html">Registreren</a></p>
			</section>
			<section class="container">
				<img src="./img/logo.svg" />
			</section>
		</main>
	</body>
</html>
