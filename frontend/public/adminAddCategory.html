<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>catogorie toevoegen</title>
    <script type="module" src="./js/shared/sidebar.js" defer></script>
    <link rel="stylesheet" href="./css/adminAddCategory.css">
    <link rel="stylesheet" href="./index.css"/>
</head>

<body>
    <sidebar-component></sidebar-component>

    <div class="admin-container">
        <h1 class="section-title">catogorie toevoegen</h1>
        <form id="categoryForm" class="category-form" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">catogorie naam:</label>
                <input type="text" id="name" name="name" required>
                <div class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="description">Beschrijving:</label>
                <textarea id="description" name="description" required></textarea>
                <div class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="img">Catogorie afbeelding:</label>
                <input type="file" id="img" name="img" accept="image/*">
                <div class="error-message"></div>
            </div>

            <button type="submit" id="submitBtn" class="btn">Bevestigen</button>
        </form>

        <div id="message"></div>
    </div>

    <script type="module" src="./js/adminAddCategory.js"></script>
</body>

</html>
